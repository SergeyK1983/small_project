<!DOCTYPE html>
<html lang="en, ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="
              default-src 'self';
              script-src 'self';
              style-src 'self';
              img-src 'self' data:;
              font-src 'self';
              object-src 'none';
              base-uri 'none';
              frame-ancestors 'none';
              form-action 'self';
          "
    >

    {% block title %}
    {% endblock title %}

    {% block styles %}
    {% endblock styles %}
</head>
<body>
    {% block main %}
    {% endblock main %}

    {% block scripts %}
    {% endblock scripts %}
</body>
</html>
